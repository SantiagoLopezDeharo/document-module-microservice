services:
  converter:
    image: slincsilver/document-module-microservice:1.0.1
    build: .
    restart: unless-stopped
    environment:
      SERVER_ADDRESS: ":8080"
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
